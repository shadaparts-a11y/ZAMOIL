<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>زامۆیل | ڤالڤۆلین و فلتەری ئۆتۆمۆبیل</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Rabar / Noto Sans Arabic for Kurdish Sorani) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#E31837',
                            blue: '#002B49',
                            dark: '#0B132B'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans Arabic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32">

    <!-- Mobile Header -->
    <header class="sticky top-0 z-30 bg-slate-900 border-b border-slate-800 shadow-lg px-4 py-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="bg-brand-red text-white p-2 rounded-xl text-lg font-black shadow-md">
                    <i class="fa-solid fa-oil-can"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight text-white">زامۆیل <span class="text-xs bg-brand-red px-1.5 py-0.5 rounded text-white">فەرمی</span></h1>
                    <p class="text-[11px] text-slate-400">بریکاری سەرەکی ڤالڤۆلین لە سلێمانی</p>
                </div>
            </div>

            <!-- Settings / Phone Config Button -->
            <button onclick="openConfigModal()" class="p-2 bg-slate-800 text-slate-300 rounded-xl text-sm">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>

        <!-- Search Bar -->
        <div class="mt-3 relative">
            <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="searchInput" oninput="filterProducts()" placeholder="گەڕان بەدوای ڕۆن، ڤیسکۆسیتی یان فلتەر..." class="w-full pr-10 pl-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-red">
        </div>
    </header>

    <!-- Categories Horizontal Scroll -->
    <div class="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-4 py-2.5 flex space-x-2 space-x-reverse overflow-x-auto scrollbar-none">
        <button onclick="setCategory('all', this)" class="cat-btn active px-3.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap bg-brand-red text-white transition">هەموو بەرهەمەکان</button>
        <button onclick="setCategory('Engine Oil', this)" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 transition">ڕۆنی مەکینە</button>
        <button onclick="setCategory('Filter', this)" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 transition">فلتەر</button>
        <button onclick="setCategory('Transmission', this)" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 transition">ڕۆنی گێر</button>
    </div>

    <!-- Main Products Vertical List (Optimized for Mobile Phone Screens) -->
    <main class="p-4 max-w-2xl mx-auto">
        <div id="productGrid" class="space-y-3">
            <!-- Loading state -->
            <div class="text-center py-20 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-brand-red"></i>
                <p class="text-xs">لە کاتی بارکردنی زانیارییەکان...</p>
            </div>
        </div>

        <!-- Empty state -->
        <div id="emptyState" class="hidden text-center py-16 bg-slate-900 rounded-2xl border border-slate-800 p-6">
            <i class="fa-solid fa-box-open text-4xl text-slate-600 mb-2"></i>
            <h3 class="text-sm font-bold text-slate-300">هیچ بەرهەمێک نەدۆزراوەتەوە</h3>
            <p class="text-xs text-slate-500 mt-1">تکایە ناو یان جۆری گەڕانەکەت بگۆڕە</p>
        </div>
    </main>

    <!-- Fixed Bottom Sticky Order Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 p-4 shadow-2xl z-40">
        <div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
            <div>
                <span class="text-xs text-slate-400 block">بڕی هەڵبژێردراو:</span>
                <span id="totalSelectedCount" class="text-sm font-extrabold text-brand-red">٠ بەرهەم</span>
            </div>
            <button onclick="sendOrderViaWhatsApp()" class="flex-grow py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg flex items-center justify-center space-x-2 space-x-reverse transition">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span>ناردنی داواکاری بۆ وەتسአپ</span>
            </button>
        </div>
    </div>

    <!-- Configuration Modal -->
    <div id="configModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 class="text-sm font-bold text-white">ڕێکخستنی ژمارەی وەتسአپ</h3>
                <button onclick="closeConfigModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">ژمارەی مۆبایل (بە کۆدی وڵات، بێ پڵەس):</label>
                <input type="text" id="storePhoneInput" placeholder="9647501234567" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white">
            </div>
            <button onclick="saveConfig()" class="w-full py-2.5 bg-brand-red text-white text-xs font-bold rounded-xl">پاشەکەوتکردن</button>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // STEP: Paste your Google Sheet ID inside the quotes below
        const SHEET_ID = '1W1YMF6mBYz2C7GK4LJ1D0ytO4y1sQCZ0dxR451gsP9k';
        
        // STEP: Your WhatsApp number default
        let storePhoneNumber = localStorage.getItem('zamoil_phone') || '9647702818151';

        let productsData = [];
        let cart = {}; // stores product ID and quantity
        let activeCategory = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('storePhoneInput').value = storePhoneNumber;
            fetchGoogleSheetData();
        });

        async function fetchGoogleSheetData() {
            try {
                const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/1`);
                productsData = await res.json();
                renderProducts();
            } catch (err) {
                document.getElementById('productGrid').innerHTML = `
                    <div class="text-center py-12 text-red-400 text-xs">
                        هەڵە لە بارکردنی زانیارییەکان. دڵنیابە لەوەی گووگڵ شیتەکەت بۆ هەموان کراوعەیە (Anyone with the link).
                    </div>
                `;
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            grid.innerHTML = '';

            const filtered = productsData.filter((item, index) => {
                const title = (item.Title || '').toLowerCase();
                const spec = (item.Spec || '').toLowerCase();
                const cat = (item.Category || '').trim();

                const matchesSearch = title.includes(query) || spec.includes(query);
                const matchesCat = activeCategory === 'all' || cat.toLowerCase() === activeCategory.toLowerCase();

                return matchesSearch && matchesCat;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            filtered.forEach((item, index) => {
                const qty = cart[index] || 0;
                const imgSrc = item.ImageURL || 'https://via.placeholder.com/150?text=ZAMOIL';

                const cardHtml = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between gap-3 shadow-sm">
                        <!-- Product Info -->
                        <div class="flex items-center space-x-3 space-x-reverse flex-grow">
                            <img src="${imgSrc}" class="w-16 h-16 object-contain bg-slate-950 rounded-xl p-1 border border-slate-800 flex-shrink-0" onerror="this.src='https://via.placeholder.com/150?text=ZAMOIL'">
                            <div>
                                <span class="text-[10px] font-bold text-brand-red bg-brand-red/10 px-2 py-0.5 rounded uppercase">${item.Category || 'بەرهەم'}</span>
                                <h2 class="text-sm font-bold text-white mt-1 leading-snug">${item.Title}</h2>
                                <p class="text-[11px] text-slate-400 mt-0.5">${item.Spec || ''}</p>
                                <div class="text-xs font-extrabold text-brand-red mt-1">${item.Price || ''}</div>
                            </div>
                        </div>

                        <!-- Quantity Selector Controls -->
                        <div class="flex flex-col items-end justify-center flex-shrink-0">
                            <div class="flex items-center space-x-1 space-x-reverse bg-slate-950 border border-slate-800 rounded-xl p-1">
                                <button onclick="updateQty(${index}, -1)" class="w-7 h-7 bg-slate-800 text-white rounded-lg flex items-center justify-center text-xs font-bold active:scale-95">-</button>
                                <span class="w-6 text-center text-xs font-extrabold text-white">${qty}</span>
                                <button onclick="updateQty(${index}, 1)" class="w-7 h-7 bg-brand-red text-white rounded-lg flex items-center justify-center text-xs font-bold active:scale-95">+</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });

            updateCartSummary();
        }

        function setCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-brand-red', 'text-white');
                b.classList.add('bg-slate-800', 'text-slate-300');
            });
            btn.classList.remove('bg-slate-800', 'text-slate-300');
            btn.classList.add('bg-brand-red', 'text-white');
            renderProducts();
        }

        function filterProducts() {
            renderProducts();
        }

        function updateQty(index, delta) {
            if (!cart[index]) cart[index] = 0;
            cart[index] += delta;
            if (cart[index] < 0) cart[index] = 0;
            if (cart[index] === 0) delete cart[index];
            renderProducts();
        }

        function updateCartSummary() {
            let totalItems = 0;
            Object.values(cart).forEach(q => totalItems += q);
            document.getElementById('totalSelectedCount').innerText = `${totalItems} بەرهەم`;
        }

        function sendOrderViaWhatsApp() {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                alert('تکایە سەرەتا لایەنی کەم بەرهەمێک دیاری بکە بۆ داواکردن.');
                return;
            }

            let msg = `*📦 داواکاری نوێ لە زامۆیل (فەرمی)*\n-----------------------------------\n\n`;
            
            keys.forEach((index, i) => {
                const item = productsData[index];
                const qty = cart[index];
                msg += `${i + 1}. *${item.Title}*\n`;
                msg += `   • بڕ: *${qty}* | نرخ: ${item.Price || 'نادیار'}\n`;
                if (item.Spec) msg += `   • جۆر: ${item.Spec}\n`;
                msg += `\n`;
            });

            msg += `-----------------------------------\n_نێردرا لە ڕێگەی کەتەلۆگی ئەلیکترۆنی زامۆیل_`;

            const url = `https://wa.me/${storePhoneNumber}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
        function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }
        function saveConfig() {
            const val = document.getElementById('storePhoneInput').value.trim();
            if (val) {
                storePhoneNumber = val;
                localStorage.setItem('zamoil_phone', storePhoneNumber);
                closeConfigModal();
                alert('ژمارەی وەتسአپ بە سەرکەوتوویی پاشەکەوت کرا.');
            }
        }
    </script>
</body>
</html>
